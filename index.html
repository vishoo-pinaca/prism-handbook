.brand small{font-size:.86rem;color:var(--faint)}

/* Hero */
.hero{max-width:1120px;margin:0 auto;padding:52px 24px 44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(2.2rem,4.6vw,3.5rem);line-height:1.06;letter-spacing:-.02em;font-weight:400;margin:0 0 20px}
.hero p.intro{font-size:1.12rem;line-height:1.6;color:var(--muted);max-width:32em;margin:0 0 24px}
.hero figure{margin:0;border:1px solid var(--line);background:#0A0E13;border-radius:6px;padding:18px 16px 12px}
.hero svg{width:100%;height:auto;display:block}
.hero figcaption{font-size:.88rem;color:var(--faint);font-style:italic;text-align:center;margin-top:6px}
.beam{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1s ease-out .2s forwards}
.ray{opacity:0;animation:fan .8s ease-out 1.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fan{to{opacity:1}}

/* Sticky search */
.controls{position:sticky;top:0;z-index:5;background:rgba(7,9,12,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.controls-inner{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;font:inherit;font-size:1rem;padding:11px 14px 11px 42px;border:1px solid var(--line-strong);border-radius:2px;background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.btn{font:inherit;font-size:.92rem;padding:10px 16px;border-radius:2px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.count{font-size:.88rem;color:var(--faint);min-width:9em;text-align:right;font-variant-numeric:tabular-nums}

/* Layout + table of contents */
.wrap{max-width:1120px;margin:0 auto;padding:36px 24px 72px}
nav.toc{position:sticky;top:92px;align-self:start}
nav.toc p{font-size:.85rem;color:var(--faint);margin:0 0 10px}
nav.toc ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line-strong)}
nav.toc a{display:flex;justify-content:space-between;gap:8px;padding:6px 0 6px 14px;margin-left:-1px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;font-size:.93rem}
nav.toc a:hover{color:var(--ink)}
nav.toc a.on{color:var(--ink);border-left-color:var(--accent)}
nav.toc span{font-variant-numeric:tabular-nums;color:var(--faint)}
nav.toc li.gl{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}

/* Sections */
section.group{margin-bottom:56px}
section.group[hidden]{display:none}
.group h2,.start h2{font-size:1.75rem;letter-spacing:-.01em;margin:0 0 6px;font-weight:400}
.group .sub,.start .sub{color:var(--muted);margin:0 0 18px;font-size:1rem}

/* Questions */
.item{border-top:1px solid var(--line)}
.item:last-child{border-bottom:1px solid var(--line)}
.item[hidden]{display:none}
.q{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr 30px;gap:16px;align-items:start;padding:18px 4px;cursor:pointer;font-size:1.08rem;line-height:1.4;color:var(--ink)}
.q:hover .qt{color:var(--accent)}
.q:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:30px;height:30px;border:1px solid var(--line-strong);background:var(--surface);position:relative;transition:background .25s ease,border-color .25s ease;margin-top:-3px}
.icon::before,.icon::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:1.5px;background:var(--ink);transform:translate(-50%,-50%)}
.icon::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .25s ease}
.item.open .icon{background:var(--raised);border-color:var(--accent)}
.item.open .icon::before,.item.open .icon::after{background:var(--accent)}
.item.open .icon::after{transform:translate(-50%,-50%) rotate(0deg)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.item.open .panel{grid-template-rows:1fr}
.panel>div{overflow:hidden}
.a{font-size:1.02rem;line-height:1.65;color:var(--ink-2);padding:0 46px 24px 4px;max-width:44em}
.a .lead{font-size:1.06rem;line-height:1.55;color:var(--ink);padding:2px 0 2px 16px;border-left:2px solid var(--accent);margin:0 0 1em}
.a p{margin:0 0 .75em}
.a ul{margin:0 0 .75em;padding-left:1.2em}
.a li{margin-bottom:.35em}
.a li::marker{color:var(--accent-3)}
.a strong{font-weight:700;color:var(--ink)}
.ref{display:inline-block;font-size:.8rem;color:var(--accent);background:var(--raised);border:1px solid var(--line-strong);padding:3px 10px;border-radius:2px;margin-top:4px}
.check{font-size:.95rem;line-height:1.55;color:var(--ink-2);background:var(--warn-bg);border:1px solid rgba(217,163,94,.35);border-left:2px solid var(--warn);padding:11px 14px 11px 14px;margin:.2em 0 1em}
.check strong{display:flex;align-items:center;gap:8px;color:var(--warn);font-weight:700;margin-bottom:3px}
.check strong::before{content:"";width:14px;height:13px;background:var(--warn);clip-path:polygon(50% 0,100% 100%,0 100%)}

section.start{margin-bottom:60px}
section.start[hidden]{display:none}
.start h3{font-size:1.15rem;margin:0 0 14px;font-weight:400;color:var(--ink)}

/* Start here */
.pitch{font-size:1.25rem;line-height:1.5;margin:0 0 36px;padding:20px 24px;background:var(--surface);border:1px solid var(--line-strong);border-left:2px solid var(--accent)}
.pitch p{margin:0}
.pitch .label{font-size:.85rem;color:var(--accent);margin:0 0 8px}
.label{font-size:.85rem;color:var(--faint);margin:0 0 10px}
.flow{margin:0 0 36px;padding:18px;border:1px solid var(--line);border-radius:6px;background:#0A0E13}
.lane{padding:14px;border-radius:4px}
.lane.video{background:var(--bg);border:1px solid var(--line-strong)}
.lane.ai{background:var(--raised);border:1px dashed var(--accent-3)}
.lane.ai .label{color:var(--accent-2)}
.steps{display:flex;align-items:stretch;gap:8px}
.step{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:2px;padding:11px 13px}
.lane.ai .step{border-color:#2C4252}
.step b{display:block;font-size:.98rem;font-weight:400;color:var(--ink)}
.step span{display:block;font-size:.86rem;color:var(--muted);line-height:1.45;margin-top:3px}
.arr{flex:0 0 18px;align-self:center;color:var(--faint);display:grid;place-items:center}
.bridge{display:flex;justify-content:center;gap:32px;padding:12px 0;font-size:.9rem;color:var(--ink-2)}
.bridge span{display:flex;align-items:center;gap:6px}
.bridge svg{color:var(--accent)}
.flow-notes{margin:14px 0 0;padding:0;list-style:none;font-size:.95rem;line-height:1.55;color:var(--muted)}
.flow-notes strong{color:var(--ink);font-weight:400}
.flow-notes li{margin-top:6px}
.ideas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 22px}
.idea{position:relative;background:var(--surface);border:1px solid var(--line-strong);padding:18px 20px}
.idea .num{position:absolute;top:14px;right:18px;font-size:1.5rem;color:#2C3640}
.idea b{display:block;font-size:1.05rem;font-weight:400;color:var(--ink);line-height:1.35;margin:0 36px 6px 0}
.idea p{margin:0;font-size:.96rem;line-height:1.55;color:var(--muted)}
.tip{padding:14px 18px;background:var(--warn-bg);border:1px solid rgba(217,163,94,.35);border-left:2px solid var(--warn);font-size:.98rem;color:var(--ink-2)}
.tip strong{color:var(--warn)}
.tip em{font-style:normal;color:var(--warn)}

/* Glossary */
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px;margin:0}
.term{padding:14px 0;border-top:1px solid var(--line);break-inside:avoid}
.term[hidden]{display:none}
.term dt{font-size:1rem;color:var(--accent);margin:0 0 4px}
.term dd{margin:0;font-size:.97rem;line-height:1.55;color:var(--ink-2)}
.term dd em{color:var(--muted)}
.tag{display:inline-block;margin-left:6px;font-size:.72rem;line-height:1.5;color:var(--bg);background:var(--accent);padding:0 7px;border-radius:2px;vertical-align:2px}

mark{background:var(--mark);color:inherit;border-radius:1px;padding:0 1px}
.empty{font-size:1.05rem;color:var(--muted);padding:24px 0}
footer{max-width:1120px;margin:0 auto;padding:0 24px 48px;color:var(--faint);font-size:.9rem}
footer p{border-top:1px solid var(--line);padding-top:22px;margin:0}
footer .logo{width:88px;margin-bottom:12px;background:var(--faint)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-top:34px;gap:28px}
  .wrap{grid-template-columns:minmax(0,1fr);gap:8px}
  nav.toc{position:static}
  nav.toc ol{display:flex;gap:8px;overflow-x:auto;border-left:0;padding-bottom:6px}
  nav.toc li{flex:0 0 auto}
  nav.toc li.gl{margin:0;padding:0;border:0}
  nav.toc a{border:1px solid var(--line-strong);padding:6px 12px;margin:0;background:var(--surface)}
  nav.toc a.on{border-color:var(--accent)}
  .count{display:none}
  .a{padding-right:8px}
  .gloss{grid-template-columns:1fr}
  .steps{flex-direction:column}
  .arr{transform:rotate(90deg)}
  .bridge{flex-direction:column;align-items:center;gap:4px}
  .ideas{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .beam{stroke-dashoffset:0}.ray{opacity:1}
  html{scroll-behavior:auto}
}
/* Print: light paper, every answer expanded, no controls */
@media print{
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --raised:#F3F6F8; --ink:#000000; --ink-2:#1C2128; --muted:#3E4650; --faint:#5A626C;
    --line:#D5DAE0; --line-strong:#C3CAD2; --accent:#1F5A7A; --accent-2:#2D6E92; --accent-3:#3F7FA3; --accent-4:#4F8CB0;
    --warn:#8A5A12; --warn-bg:#FBF3E6; --mark:#FFE6B8; color-scheme:light;
  }
  html,body{background:#fff}
  .controls,nav.toc,.hero figure,body::before,.icon{display:none!important}
  .hero{display:block;padding:20px 24px 8px}
  .wrap{display:block;padding-top:8px}
  .panel{grid-template-rows:1fr!important}
  .q{padding:12px 0 6px}
  .a{padding:0 0 12px}
  .flow,.lane.video,.idea .num{background:#fff}
  .idea .num{color:#C3CAD2}
  .item,.flow,.idea,.pitch,.term{break-inside:avoid}
  .start h3,.group h2,.group .sub{break-after:avoid}
  a{color:inherit;text-decoration:none}
}
</style>
</head>

nt-weight="700" font-family="Arial, sans-serif">Investigate</text><text x="386" y="268" fill="#A3ABB3" font-size="12" font-family="Arial, sans-serif">Builds a case from footage</text></g></svg>

const GLOSSARY = [
[
"Embedder",
"The service that picks the best 3 frames of each tracked person or vehicle and turns them into vectors for search.",
""
],
[
"Hardware-bound licence",
"A licence tied to the box’s own hardware, so the software can’t simply be copied to another machine.",
""
],
[
"Maintainer",
"The one service allowed to delete data. At 85% disk it removes the oldest footage and says so.",
""
],
[
"Network Setup",
"The screen and service that scan the site for cameras: ONVIF first, known RTSP addresses as a fallback.",
""
],
[
"Parity check",
"A check that keeps the customer install package’s configuration identical to the version that was tested.",
""
],
[
"Source manager",
"The one place where every camera starts. It adds AI to a camera only when a plugin is switched on.",
""
],
[
"Stream sink",
"The service that sends the live view out. It passes video through without re-compressing it and fills any stall with a holding image.",
""
],
[
"Thinning",
"Reducing a fast camera’s frame rate, to about 12 frames per second, so the AI isn’t overloaded.",
""
],
[
"Activity Layer",
"A saved search you teach by example: mark moments as normal or suspicious, and PRISM flags new moments like the suspicious ones.",
""
],
[
"Alert inbox",
"The single place where every kind of PRISM alert lands, to be reviewed and acknowledged.",
""
],
[
"Alert workflow",
"A short chain of AI checks (such as a face check or a scene check) that a recorder’s alarm passes through before reaching an operator.",
""
],
[
"Anonymous watchlist",
"Where unknown faces are kept, unnamed, until an operator decides who they are.",
""
],
[
"ASTRA",
"PRISM’s sibling product. Both share the same command-center look and feel.",
""
],
[
"Audit log",
"An automatic record of every change: who did what, and what it was before and after.",
""
],
[
"Bounding box",

""
],
[

""
],
[
"Case",
"A forensic investigation: uploaded footage and everything found in it, kept until the case is deleted.",
""
],
[

""
],
[

""
],
[

],

const dl = document.querySelector("#glossary dl");
const input = document.getElementById("q");
const countEl = document.getElementById("count");
const terms = [];
GLOSSARY.sort((a,b)=>a[0].localeCompare(b[0])).forEach(([t,def,tag]) => {
  const div = document.createElement("div");
  div.className = "term";
  const chip = tag ? ` <span class="tag">${tag}</span>` : "";
  div.innerHTML = `<dt>${t}${chip}</dt><dd>${def}</dd>`;
  dl.appendChild(div);
  terms.push({el:div, dt:div.querySelector("dt"), dd:div.querySelector("dd"), t, def, chip, text:(t+" "+def+" "+(tag||"")).toLowerCase()});
});
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function hl(html, term){
  if(!term) return html;
  const re = new RegExp("(" + esc(term) + ")", "gi");
  return html.split(/(<[^>]+>)/).map(p => p.startsWith("<") ? p : p.replace(re, "<mark>$1</mark>")).join("");
}
function filter(){
  const term = input.value.trim(), t = term.toLowerCase();
  let shown = 0;
  terms.forEach(g => {
    const hit = !t || g.text.includes(t);
    g.el.hidden = !hit;
    g.dt.innerHTML = hl(g.t, term) + g.chip; g.dd.innerHTML = hl(g.def, term);
    if(hit) shown++;
  });
  let empty = document.getElementById("empty");
  if(!shown){
    if(!empty){ empty = document.createElement("p"); empty.id = "empty"; empty.className = "empty"; dl.after(empty); }
    empty.textContent = `No term mentions “${term}”. Try a broader word, like “camera”, “GPU” or “alert”.`;
  } else if(empty) empty.remove();
  countEl.textContent = `${shown} terms`;
}
input.addEventListener("input", filter);
filter();
</script>
